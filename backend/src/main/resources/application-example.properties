# Example application.properties
# Rename to application-local.properties and set spring.profiles.active=local, or use environment variables

spring.application.name=HarvestHub
spring.datasource.url=jdbc:h2:mem:harvesthub;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

server.port=8080

jwt.secret=generate-a-long-random-secret-for-jwt-signing
jwt.expiration=86400000
